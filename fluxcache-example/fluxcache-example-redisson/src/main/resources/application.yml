server:
  port: 8091

spring:
  application:
    name: flux-cache-redisson

redis:
  host: 127.0.0.1
  port: 6379
  password:

flux:
  cache:
    defaultCacheLevel: FirstCacheable
    asyncMonitorEnable: true
    cacheMonitorEnable: true
    warmUpEnable: true
    warmUpDelaySeconds: 5
    # 一级缓存全局默认，注解未配置时回落到这里
    first-cache:
      ttl: 5
      time-unit: MINUTES
      cache-type: CAFFEINE
      init-size: 20
      max-size: 2000
    # 二级缓存全局默认
    secondary-cache:
      ttl: 5
      time-unit: MINUTES
      cache-type: REDIS

logging:
  level:
    com.fluxcache.example: DEBUG
