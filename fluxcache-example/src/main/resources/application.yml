server:
  port: 8090


spring:
  application:
    name: flux-cache

redis:
  host: 127.0.0.1
  port: 6379
  password: 123456

flux:
  cache:
    defaultCacheLevel: FirstCacheable
    asyncMonitorEnable: true
    cacheMonitorEnable: true
    #    prefix: /weihubeats
    admin:
      cors:
        enabled: true
        allowed-origin-patterns:
          - "http://localhost:*"
          - "http://127.0.0.1:*"
logging:
  level:
    com:
      fluxcache:
      example: DEBUG