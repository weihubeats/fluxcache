server:
  port: 8090

spring:
  application:
    name: flux-cache-order

redis:
  host: 127.0.0.1
  port: 6379
  password:

flux:
  cache:
    namespace: flux-cache-order
    defaultCacheLevel: FirstCacheable
    asyncMonitorEnable: true
    cacheMonitorEnable: true
    warmUpEnable: true
    warmUpDelaySeconds: 5
    # 一级缓存全局默认，注解未配置时回落到这里
    first-cache:
      ttl: 5
      time-unit: MINUTES
      cache-type: CAFFEINE
      init-size: 20
      max-size: 2000
    # 二级缓存全局默认
    secondary-cache:
      ttl: 5
      time-unit: MINUTES
      cache-type: REDIS
    # 热 Key 探测（示例演示用低阈值配置：1 秒窗口槽，QPS>10 且未命中>=1，连续 2 个窗口确认）
    # 生产环境建议使用默认阈值（60s 窗口，10s 槽，QPS>=10 && miss>=5）
    hot-key:
      enabled: true
      window-seconds: 10
      slot-seconds: 1
      hot-qps-threshold: 10.0
      hot-miss-threshold: 1
      confirm-ticks: 2
      max-hot-key-capacity: 200000
      notify-interval-ms: 30000

logging:
  level:
    com.fluxcache.example: DEBUG
